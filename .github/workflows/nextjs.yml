name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build

      # Pulse (https://github.com/RohanDey02/pulse, private) publishes its
      # browser build as a release asset built for the /RohanDey/pulse/ path.
      # The newest one is unpacked into the export, so it is served next to
      # this site at https://rohandey02.github.io/RohanDey/pulse/.
      #
      # PULSE_RELEASES_TOKEN is a fine-grained token with read-only Contents
      # access to that repository. Without it the site deploys on its own.
      - name: Add the Pulse web app at /pulse
        env:
          GH_TOKEN: ${{ secrets.PULSE_RELEASES_TOKEN }}
          PULSE_REPO: RohanDey02/pulse
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PULSE_RELEASES_TOKEN is not set, so the site is deploying without /pulse."
            exit 0
          fi
          # Newest release that carries a web bundle. Releases cut before the
          # browser build existed have none.
          asset_url="$(gh api "repos/${PULSE_REPO}/releases?per_page=30" --jq '
            [.[] | select(.draft | not) | .assets[]
              | select(.name | test("^pulse-.*-web[.]tar[.]gz$"))][0].url // empty')"
          if [ -z "$asset_url" ]; then
            echo "::warning::No Pulse release has a web bundle yet, so the site is deploying without /pulse."
            exit 0
          fi
          # From here a failure stops the deploy: publishing without /pulse
          # would take down the copy that is live now.
          gh api "$asset_url" -H "Accept: application/octet-stream" > pulse-web.tar.gz
          mkdir -p out/pulse
          tar -xzf pulse-web.tar.gz -C out/pulse
          rm pulse-web.tar.gz
          test -f out/pulse/index.html
          grep -q '<base href="/RohanDey/pulse/">' out/pulse/index.html || {
            echo "::error::The Pulse bundle was not built for /RohanDey/pulse/."
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
